[project]
name = "llm-inference"
version = "0.1.0"
description = "Clean-architecture FastAPI server for Ministral-3-3B vision-language inference on CPU via ONNX Runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pillow>=11.0.0",
    "slowapi>=0.1.9",
    "onnxruntime-gpu>=1.20.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0",
    "huggingface-hub>=0.26.0",
    "numpy>=1.26.0",
    "openai>=2.32.0",
]

[tool.uv]
package = false
